<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003d7a" />
    <title>Imboni</title>
    <!--
      Fonts are self-hosted (see the @font-face block at the top of src/index.css).
      Preload the two that every page needs so they start downloading alongside
      the stylesheet rather than after the browser has parsed it. latin-ext is
      deliberately not preloaded: its unicode-range means it is almost never used.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-subset.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
