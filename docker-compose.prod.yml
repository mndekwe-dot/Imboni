# Production overrides for the Imboni stack.
#
# Usage (compose merges this on top of the base file):
#   docker compose --env-file .env.prod \
#       -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Assumes an edge proxy / load balancer terminates TLS for your wildcard domain
# (e.g. *.imboni.com) and forwards requests to the `web` service with
# `X-Forwarded-Proto: https`. The app already trusts that header
# (SECURE_PROXY_SSL_HEADER), so SECURE_SSL_REDIRECT and secure cookies engage
# correctly once TLS is in front.
#
# Secrets come from `.env.prod` (gitignored — see .env.prod.example). The `:?`
# substitutions below make compose FAIL FAST if a required secret is missing.

x-prod-backend-env: &prod_backend_env
  MY_DEBUG: "False"
  # TLS is terminated at the edge, so re-enable the http->https redirect + HSTS.
  SECURE_SSL_REDIRECT: "True"
  # Your real hosts, e.g. ".imboni.com" (leading dot covers every subdomain).
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env.prod}
  THE_SECRET_KEY: ${THE_SECRET_KEY:?set THE_SECRET_KEY in .env.prod}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env.prod}

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env.prod}
    restart: always

  redis:
    restart: always

  backend:
    environment: *prod_backend_env
    # ASGI: serves the REST API and the /imboni/ws/notifications/ stream in one
    # process. With >1 worker the Redis channel layer (CHANNEL_LAYERS_REDIS_URL,
    # db 3) is what makes a push reach a socket held by a *different* worker —
    # do not run multi-worker without it.
    #
    # --no-access-log: a browser cannot send an Authorization header on a
    # WebSocket handshake, so the access token travels in the query string. An
    # access log would write live JWTs to disk. Request-level logging stays at
    # the nginx edge; if you re-enable this, strip `token=` from the log format
    # first (nginx: log $uri, not $request).
    command: >
      uvicorn Imboni.asgi:application
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-4}
      --proxy-headers
      --forwarded-allow-ips "*"
      --no-access-log
    restart: always

  worker:
    environment: *prod_backend_env
    command: celery -A Imboni worker -l warning --concurrency ${CELERY_CONCURRENCY:-4}
    restart: always

  beat:
    environment: *prod_backend_env
    command: celery -A Imboni beat -l warning
    restart: always

  web:
    # This container IS the TLS edge. nginx.prod.conf.template replaces the
    # development config: it serves the ACME challenge on :80, redirects
    # everything else to https, and terminates TLS on :443.
    #
    # The nginx:alpine entrypoint runs envsubst over /etc/nginx/templates/.
    # NGINX_ENVSUBST_FILTER limits substitution to ${IMBONI_*} so nginx's own
    # runtime variables ($host, $uri, $remote_addr) survive untouched.
    #
    # Run scripts/init-letsencrypt.sh ONCE before the first `up` — nginx refuses
    # to start when ssl_certificate points at a file that does not exist, so a
    # placeholder certificate has to be in place first.
    environment:
      IMBONI_DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod, e.g. imboni.rw}
      NGINX_ENVSUBST_FILTER: "IMBONI_"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Frontend/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # Two jobs in one command, and the order matters.
    #
    # 1. Render the template. The nginx image only runs its envsubst step when
    #    the container command starts with the literal word `nginx`:
    #        if [ "$$1" = "nginx" -o "$$1" = "nginx-debug" ]; then ...
    #    Overriding command with `sh -c` makes $$1 be "sh", so that step is
    #    SILENTLY SKIPPED and the baked-in development nginx.conf stays active
    #    -- which has no ACME location block, so the certificate challenge gets
    #    answered with the SPA's index.html and validation fails. Invoke the
    #    script explicitly instead of relying on the entrypoint's guess.
    #
    # 2. Reload every 6h so a renewed certificate is actually served; nginx only
    #    reads certificate files at startup or reload. Doing it in-container
    #    avoids handing a sidecar the Docker socket just to send a signal.
    command: >
      sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh;
      while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    restart: always

  # Renews certificates in the background. Certbot exits after each attempt, so
  # it is wrapped in a loop rather than run as a one-shot: every 12 hours it
  # tries a renewal (a no-op until the cert is inside its 30-day window).
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    depends_on:
      - web
    restart: always

volumes:
  certbot_certs:
  certbot_webroot:
